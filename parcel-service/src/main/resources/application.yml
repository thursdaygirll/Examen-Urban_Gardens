server:
  port: 8081

spring:
  application:
    name: parcel-service

  datasource:
    url: jdbc:postgresql://localhost:5432/urban_gardens
    username: urban_user
    password: urban_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

logging:
  level:
    com.urbangardens: DEBUG
    org.hibernate.SQL: DEBUG
